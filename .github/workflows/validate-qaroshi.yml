name: Qaroshi validation
on:
  pull_request:
  push:
    branches: [main]
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - name: Check Wiki browser JavaScript syntax and grammar parity
        run: |
          node --check web/grammar_live.js
          node --check web/wiki_lab.js
          node --check web/qaroshi.js
          node tests/wiki95/grammar_browser.cjs
      - name: Build site
        run: make build
      - name: Check curated site and release integrity
        run: python tools/maintenance/audit_repository.py --site
      - name: Build and report 8.3 linguistic coverage
        run: make stress83
      - name: Build and report 8.4 functional readiness
        run: make stress84
      - name: Check 8.6 editorial challenge subset
        run: python tools/stress86/benchmark.py
      - name: Check 8.7 restricted structural patterns
        run: python tools/stress87/benchmark.py
      - name: Build 8.8 item-level semantic evidence
        run: python tools/stress88/compose.py
      - name: Upload 8.8 item-level review evidence
        uses: actions/upload-artifact@v4
        with:
          name: qaroshi-88-review-ledger
          path: |
            data/stress88/case_evidence_500.csv
            data/stress88/summary.json
          retention-days: 30
      - name: Build 8.9 full-item semantic compositions
        run: python tools/stress89/compose.py
      - name: Audit inherited 135 candidates and generate blind review
        run: python tools/stress89/audit.py
      - name: Upload 8.9 composition evidence
        uses: actions/upload-artifact@v4
        with:
          name: qaroshi-89-composition-500
          path: |
            data/stress89/case_evidence_500.csv
            data/stress89/composition_summary.json
            data/stress89/all_candidate_form_audit_500.csv
            data/stress89/audit_summary.json
          retention-days: 30
      - name: Upload blind prompts separately from reviewer answer key
        uses: actions/upload-artifact@v4
        with:
          name: qaroshi-89-blind-prompts-135
          path: data/stress89/blind_qaroshi_prompts_135.csv
          retention-days: 30
      - name: Upload separate review answer key
        uses: actions/upload-artifact@v4
        with:
          name: qaroshi-89-reviewer-key-135
          path: data/stress89/separate_answer_key_135.csv
          retention-days: 30
      - name: Build 9.0 semantic compositions for unresolved challenges
        run: python tools/stress90/compose.py
      - name: Upload 9.0 case-by-case editorial evidence
        uses: actions/upload-artifact@v4
        with:
          name: qaroshi-90-500-case-evidence
          path: |
            data/stress90/case_evidence_500.csv
            data/stress90/summary.json
          retention-days: 30
      - name: Audit inherited 190 drafts and prepare 9.0 blind reading
        run: python tools/stress90/audit.py
      - name: Upload 9.0 independent formal review and unresolved case list
        uses: actions/upload-artifact@v4
        with:
          name: qaroshi-90-editorial-review
          path: |
            data/stress90/formal_review_500.csv
            data/stress90/unresolved_cases.csv
            data/stress90/audit_summary.json
          retention-days: 30
      - name: Upload blind prompts with no English answer
        uses: actions/upload-artifact@v4
        with:
          name: qaroshi-90-blind-prompts
          path: data/stress90/blind_qaroshi_only.csv
          retention-days: 30
      - name: Upload separate reviewer answer key
        uses: actions/upload-artifact@v4
        with:
          name: qaroshi-90-reviewer-key
          path: data/stress90/private_english_answer_key.csv
          retention-days: 30
      - name: Compose all remaining 9.1 challenge drafts
        run: python tools/stress91/compose.py
      - name: Upload 9.1 all-500 editorial composition ledger
        uses: actions/upload-artifact@v4
        with:
          name: qaroshi-91-all-500-editorial
          path: |
            data/stress91/case_evidence_500.csv
            data/stress91/summary.json
          retention-days: 30
      - name: Audit all 500 full editorial drafts and prepare blind comprehension packets
        run: python tools/stress91/audit.py
      - name: Upload 9.1 formal audit and meaning limitations
        uses: actions/upload-artifact@v4
        with:
          name: qaroshi-91-formal-review-500
          path: |
            data/stress91/formal_review_500.csv
            data/stress91/review_summary.json
          retention-days: 30
      - name: Upload Qaroshi-only blind reading prompts with no English originals
        uses: actions/upload-artifact@v4
        with:
          name: qaroshi-91-blind-prompts-500
          path: data/stress91/blind_qaroshi_500.csv
          retention-days: 30
      - name: Upload separate blind-test reviewer answer key
        uses: actions/upload-artifact@v4
        with:
          name: qaroshi-91-private-english-key-500
          path: data/stress91/private_reviewer_english_key_500.csv
          retention-days: 30
      - name: Check one reproducible Standard 9.2 consolidated grammar
        run: python tools/stress92/build_grammar.py --check
      - name: Run 450 genuinely new cross-family composition challenges
        run: python tools/stress92/heldout.py
      - name: Audit all 500 existing proposals for source, role and truth-condition operators
        run: python tools/stress92/semantic_audit.py
      - name: Upload 9.2 unseen cross-family 450-case semantic stress
        uses: actions/upload-artifact@v4
        with:
          name: qaroshi-92-heldout-450
          path: |
            data/stress92/unseen_compositions_450.csv
            data/stress92/unseen_summary.json
          retention-days: 30
      - name: Upload 9.2 full 500-case structural and semantic review
        uses: actions/upload-artifact@v4
        with:
          name: qaroshi-92-semantic-audit-500
          path: |
            data/stress92/semantic_review_500.csv
            data/stress92/corrected_editorial_500.csv
            data/stress92/editorial_action_queue.csv
            data/stress92/semantic_review_summary.json
          retention-days: 30
      - name: Run 9.3 typed generalized grammar AST roundtrip benchmark
        run: python tools/grammar93/benchmark.py
      - name: Complete 9.4 source semantic records for all 500 challenges
        run: python tools/semantic94/complete.py
      - name: Upload new 9.3 AST grammar benchmark
        uses: actions/upload-artifact@v4
        with:
          name: qaroshi-93-generalized-grammar
          path: |
            data/stress93/grammar_stress.csv
            data/stress93/summary.json
          retention-days: 30
      - name: Upload 9.4 source-intent semantic audit and 190 legacy records
        uses: actions/upload-artifact@v4
        with:
          name: qaroshi-94-all-500-semantic-annotation
          path: |
            data/stress94/source_semantic_requirements_500.csv
            data/stress94/legacy_190_backfilled.csv
            data/stress94/independent_comprehension_review_queue.csv
            data/stress94/summary.json
          retention-days: 30
      - name: Test reference and grammar
        run: python -m unittest discover -s tests -q
