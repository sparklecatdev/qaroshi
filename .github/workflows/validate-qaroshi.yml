name: Qaroshi validation
on:
  pull_request:
  push:
    branches: [main]
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - name: Build site
        run: make build
      - name: Check curated site and release integrity
        run: python tools/maintenance/audit_repository.py --site
      - name: Build and report 8.3 linguistic coverage
        run: make stress83
      - name: Build and report 8.4 functional readiness
        run: make stress84
      - name: Check 8.6 editorial challenge subset
        run: python tools/stress86/benchmark.py
      - name: Check 8.7 restricted structural patterns
        run: python tools/stress87/benchmark.py
      - name: Build 8.8 item-level semantic evidence
        run: python tools/stress88/compose.py
      - name: Upload 8.8 item-level review evidence
        uses: actions/upload-artifact@v4
        with:
          name: qaroshi-88-review-ledger
          path: |
            data/stress88/case_evidence_500.csv
            data/stress88/summary.json
          retention-days: 30
      - name: Build 8.9 full-item semantic compositions
        run: python tools/stress89/compose.py
      - name: Audit inherited 135 candidates and generate blind review
        run: python tools/stress89/audit.py
      - name: Upload 8.9 composition evidence
        uses: actions/upload-artifact@v4
        with:
          name: qaroshi-89-composition-500
          path: |
            data/stress89/case_evidence_500.csv
            data/stress89/composition_summary.json
            data/stress89/all_candidate_form_audit_500.csv
            data/stress89/audit_summary.json
          retention-days: 30
      - name: Upload blind prompts separately from reviewer answer key
        uses: actions/upload-artifact@v4
        with:
          name: qaroshi-89-blind-prompts-135
          path: data/stress89/blind_qaroshi_prompts_135.csv
          retention-days: 30
      - name: Upload separate review answer key
        uses: actions/upload-artifact@v4
        with:
          name: qaroshi-89-reviewer-key-135
          path: data/stress89/separate_answer_key_135.csv
          retention-days: 30
      - name: Inspect canonical glosses for remaining expression systems
        run: python tools/stress90/diagnose_glosses.py
      - name: Test reference and grammar
        run: python -m unittest discover -s tests -q
