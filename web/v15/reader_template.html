<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Qaroshi 15.0 | Living Text Library</title><meta name="description" content="Offline Qaroshi editorial conversations, literature, IPA and lexicon with corpus concordance"><style>
:root{--bg:#f8f7f4;--panel:#fff;--text:#292432;--muted:#6e6877;--line:#e8e3ea;--primary:#7454a4;--wash:#f0ebf7;--green:#267456;--shadow:0 4px 22px rgba(36,24,55,.04)}body.dark{--bg:#18171d;--panel:#25232d;--text:#eae6f0;--muted:#b0a8b9;--line:#413c48;--primary:#c8afff;--wash:#383244;--green:#87d6ae;--shadow:0 4px 22px rgba(0,0,0,.16)}*{box-sizing:border-box}body{font-family:Inter,ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif;font-size:15px;line-height:1.57;background:var(--bg);color:var(--text);margin:0}a{color:var(--primary)}button,input,select,textarea{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid #a18bcf;outline-offset:2px}.top{height:64px;position:sticky;top:0;background:var(--panel);border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 24px;gap:20px;z-index:5}.brand{font-family:Georgia,serif;letter-spacing:-.04em;font-size:22px;font-weight:700;white-space:nowrap}.brand b{color:var(--primary)}.topsearch{margin-left:auto;width:min(460px,50vw)}.topsearch input{width:100%;background:var(--wash);border:1px solid var(--line);color:var(--text);padding:9px 14px;border-radius:10px}.top .btn{flex:none}.wrap{display:grid;grid-template-columns:224px minmax(0,920px);max-width:1360px;margin:auto;gap:0;min-height:calc(100vh - 64px)}.aside{border-right:1px solid var(--line);padding:26px 15px;position:sticky;top:64px;align-self:start;max-height:calc(100vh - 64px);overflow-y:auto}.aside .eyebrow{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:800;margin:20px 11px 9px}.navbtn{border:0;background:transparent;color:var(--muted);padding:11px 13px;text-align:left;border-radius:10px;display:block;width:100%}.navbtn.active{background:var(--wash);color:var(--primary);font-weight:700}.navbtn:hover{background:var(--wash)}main{padding:42px clamp(18px,4vw,64px) 90px;min-width:0}.eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:.12em;font-weight:750;color:var(--primary)}h1{font:normal 43px/1.12 Georgia,serif;letter-spacing:-.035em;margin:12px 0 16px}h2{font:normal 27px Georgia,serif;letter-spacing:-.02em;margin:26px 0 14px}h3{font-size:17px;margin:12px 0}.lede{font-size:17px;color:var(--muted);max-width:720px;margin-bottom:22px}.muted{color:var(--muted)}.small{font-size:12px}.tag{display:inline-block;border-radius:999px;font-size:11px;font-weight:700;background:var(--wash);color:var(--primary);padding:4px 9px;margin:0 6px 6px 0}.card{background:var(--panel);border:1px solid var(--line);padding:20px;border-radius:14px;box-shadow:var(--shadow);margin:15px 0}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.metric{font-size:32px;font-weight:700;letter-spacing:-.06em}.caption{font-size:12px;color:var(--muted)}.btn{border:1px solid var(--line);background:var(--panel);color:var(--text);padding:8px 12px;border-radius:9px}.btn.primary{background:var(--primary);color:#fff;border-color:var(--primary)}body.dark .btn.primary{color:#23192e}.btn:hover{background:var(--wash)}.btn.primary:hover{filter:brightness(1.05)}.filters{display:flex;flex-wrap:wrap;gap:10px;margin:18px 0}.filters select,.filters input{padding:10px;border-radius:9px;background:var(--panel);color:var(--text);border:1px solid var(--line);min-width:150px}.filters input{flex:1;min-width:210px}.piece{display:block;width:100%;padding:17px 20px;text-align:left;border-radius:12px;border:1px solid var(--line);background:var(--panel);color:var(--text);margin-bottom:10px}.piece:hover{border-color:var(--primary)}.piece .name{font:normal 20px Georgia,serif;margin:0 0 4px}.piece .description{font-size:13px;color:var(--muted)}.pager{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:15px 0}.line{display:grid;grid-template-columns:44px minmax(0,1fr);gap:12px;padding:17px 0;border-bottom:1px solid var(--line)}.line:last-child{border-bottom:none}.speaker{font-size:11px;font-weight:750;letter-spacing:.08em;color:var(--primary);padding-top:4px}.q{font:normal 19px/1.6 Georgia,serif}.qword{cursor:pointer;border:none;background:transparent;color:var(--text);font:inherit;padding:0 2px;margin:0 1px 0 0;border-radius:3px}.qword:hover{background:var(--wash);color:var(--primary)}.ipa{font:12px/1.5 ui-monospace,SFMono-Regular,Consolas,monospace;color:var(--muted);margin-top:4px}.english{font-size:14px;margin:7px 0 0}.divider{height:1px;background:var(--line);margin:22px 0}.notice{background:var(--wash);padding:15px 19px;border-radius:11px;border-left:3px solid var(--primary);margin:18px 0}.refbox{background:var(--panel);border-radius:12px;border:1px solid var(--line);padding:19px}.record{padding:12px 0;border-bottom:1px solid var(--line)}.record:last-child{border:none}.record button{border:0;background:transparent;color:var(--primary);padding:0;text-align:left;font-weight:700}.entrylabel{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}.wordhead{font:normal 26px Georgia,serif}textarea{display:block;width:100%;background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:10px;padding:12px;min-height:90px}.pill{padding:3px 8px;border:1px solid var(--line);border-radius:20px;color:var(--muted);font-size:12px}.show-mobile{display:none}footer{font-size:12px;color:var(--muted);padding:25px 0}.footlinks a{display:block;margin:7px 11px}@media(max-width:800px){.top{padding:0 13px;height:60px;gap:8px}.brand{font-size:19px}.topsearch{width:100%;min-width:0}.topsearch input{font-size:13px}.wrap{display:block}.aside{display:none;position:static;max-height:none;border-right:none;border-bottom:1px solid var(--line);padding:10px 20px}.aside.open{display:block}.show-mobile{display:block}.top .btn{padding:7px}main{padding:25px 17px 80px}h1{font-size:35px}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.card{padding:15px}.line{grid-template-columns:31px minmax(0,1fr);gap:8px}.q{font-size:18px}}
</style><script src="web/theme.js"></script><link rel="stylesheet" href="web/tool-theme.css"><script defer src="web/tool-theme.js"></script></head><body><header class="top"><button class="btn show-mobile" id="menubtn" aria-label="Toggle navigation">☰</button><div class="brand">Qaroshi <b>15</b></div><div class="topsearch"><input id="globalSearch" placeholder="Search text, English, words..." aria-label="Search the corpus"></div><button class="btn" id="darkbtn" aria-label="Toggle dark mode">◐</button></header><div class="wrap"><aside class="aside" id="sidebar"><div class="eyebrow">Text library</div><nav id="nav"><button class="navbtn active" data-section="library">Corpus library</button><button class="navbtn" data-section="concordance">Concordance</button><button class="navbtn" data-section="dictionary">30,000-word lexicon</button><button class="navbtn" data-section="review">Editorial review</button><button class="navbtn" data-section="about">Methods and status</button></nav><div class="eyebrow">Other study tools</div><div class="footlinks"><a href="Qaroshi_14_Semantic_Workbench.html">14.0 Semantic Workbench</a><a href="Qaroshi_12_13_Language_Studio.html">12–13 Language Studio</a><a href="Qaroshi_Academy.html">Academy</a><a href="Qaroshi_Wiki.html">Wiki</a></div></aside><main id="main" tabindex="-1"><h1>Corpus library</h1><p>Loading...</p></main></div><script type="application/json" id="data">__DATA__</script><script>
(()=>{'use strict'; const D=JSON.parse(document.getElementById('data').textContent);const $=x=>document.querySelector(x);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const sectionNames={library:'Corpus library',concordance:'Concordance',dictionary:'Dictionary',review:'Editorial review',about:'Evidence and methods'};let state={section:'library',q:'',kind:'all',source:'all',genre:'all',page:0,piece:null,allTranslations:false,lookup:'',concordance:'',review:{}};let saved={};try{saved=JSON.parse(localStorage.getItem('qaroshi15-reviews')||'{}')}catch{};state.review=saved;
const perPage=20;const save=()=>{try{localStorage.setItem('qaroshi15-reviews',JSON.stringify(state.review))}catch{}};
const side=()=>{document.querySelectorAll('[data-section]').forEach(b=>b.classList.toggle('active',b.dataset.section===state.section));$('#sidebar').classList.remove('open')};
const h=(title,lede)=>`<div class="eyebrow">Qaroshi 15.0 · Natural Conversation & Literature</div><h1>${esc(title)}</h1><p class="lede">${esc(lede)}</p>`;
const t=(p)=>p.lines?.length||0;
function filtered(){let x=D.pieces.filter(p=>(state.kind==='all'||p.kind===state.kind)&&(state.source==='all'||p.release===state.source)&&(state.genre==='all'||p.genre===state.genre));if(state.q){const q=state.q.toLocaleLowerCase();x=x.filter(p=>(p.title+' '+p.premise+' '+p.genre+' '+p.lines.map(x=>x.qaroshi+' '+x.english_contextual).join(' ')).toLocaleLowerCase().includes(q))}return x}
function library(){if(state.piece){return detail(state.piece)}let items=filtered(),s=state.page*perPage;const n=D.stats;return h('A language in context','Read complete editorial situations, browse different genres, and inspect the evidence behind translations.')+`<div class="grid"><div class="card"><div class="metric">${n.dialogues}</div><div class="caption">Editorial conversations across releases</div></div><div class="card"><div class="metric">${n.literature}</div><div class="caption">Prose and reading pieces</div></div><div class="card"><div class="metric">${n.newTokens.toLocaleString()}</div><div class="caption">New Qaroshi-only tokens</div></div></div><div class="notice"><b>Provenance:</b> Texts are constructed editorial examples, not spontaneous speaker recordings. The older 123,000-token dialogue exercises are not counted as independently authored prose.</div><div class="filters"><select id="kindFilter" aria-label="Type"><option value="all">All text types</option><option value="dialogue" ${state.kind==='dialogue'?'selected':''}>Conversations</option><option value="literature" ${state.kind==='literature'?'selected':''}>Literature and essays</option></select><select id="sourceFilter" aria-label="Release"><option value="all">All releases</option>${D.releases.map(a=>`<option value="${esc(a)}" ${a===state.source?'selected':''}>${esc(a)}</option>`).join('')}</select><select id="genreFilter" aria-label="Genre"><option value="all">All genres</option>${D.genres.map(a=>`<option value="${esc(a)}" ${a===state.genre?'selected':''}>${esc(a)}</option>`).join('')}</select></div><div class="row muted small">${items.length} pieces match your filters · showing ${Math.min(perPage,Math.max(0,items.length-s))} on this page</div><div class="divider"></div>`+items.slice(s,s+perPage).map(p=>`<button class="piece" data-piece="${esc(p.id)}"><div class="name">${esc(p.title)}</div><div class="description">${esc(p.premise)}</div><div style="margin-top:8px"><span class="tag">${esc(p.genre)}</span><span class="tag">${esc(p.release)}</span><span class="pill">${t(p)} sentences</span></div></button>`).join('')+`<div class="pager"><button class="btn" id="prev" ${state.page===0?'disabled':''}>Previous</button><span class="muted small">Page ${state.page+1} of ${Math.max(1,Math.ceil(items.length/perPage))}</span><button class="btn" id="next" ${s+perPage>=items.length?'disabled':''}>Next</button></div>`}
function spanWords(s){return s.split(/(\s+)/).map(part=>/^\s+$/.test(part)?' ':`<button class="qword" data-word="${esc(part.replace(/^[^a-zë]+|[^a-zë-]+$/gi,''))}">${esc(part)}</button>`).join('')}
function detail(id){let p=D.pieces.find(x=>x.id===id);if(!p)return h('Not found','This reading is missing.');let note=state.review[id]||{};return `<button class="btn" id="back">← Back to library</button><div class="eyebrow" style="margin-top:20px">${esc(p.release)} · ${esc(p.genre)}</div><h1>${esc(p.title)}</h1><p class="lede">${esc(p.premise)}</p><div class="row"><button class="btn" id="translateBtn">${state.allTranslations?'Hide':'Show'} all translations</button> <span class="tag">${t(p)} ${p.kind==='dialogue'?'turns':'sentences'}</span></div><div class="card">${p.lines.map((l,i)=>`<div class="line"><div class="speaker">${esc(l.speaker||'N')}<br>${i+1}</div><div><div class="q">${spanWords(l.qaroshi)}</div><div class="ipa">${esc(l.ipa||'')}</div><details class="english-detail" ${state.allTranslations?'open':''}><summary class="small">English reading</summary><p class="english">${esc(l.english_contextual)}</p></details></div></div>`).join('')}</div><div class="card"><h3>Editorial review notes</h3><p class="small muted">Private in this browser unless exported. Not a community acceptance decision.</p><textarea id="reviewText" placeholder="Meaning ambiguities, grammatical repairs, alternate translation...">${esc(note.notes||'')}</textarea><div style="margin-top:10px"><button class="btn primary" id="saveReview">Save local note</button> ${note.saved?' <span class="tag">Saved locally</span>':''}</div></div><p class="small muted">${esc(p.provenance||'Editorial source; not speaker-attested.')}</p>`}
function concordance(){let q=state.concordance.trim().toLowerCase();let hits=[];if(q){for(const p of D.pieces)for(let i=0;i<p.lines.length;i++){let l=p.lines[i];if(l.qaroshi.toLowerCase().includes(q)){hits.push({p,l,i});if(hits.length>=120)break}if(hits.length>=120)break}}return h('Concordance','See a form in context across conversations and prose. Matches are a substring search, not a statistical collocation proof.')+`<input class="filters" id="concInput" style="padding:12px;border:1px solid var(--line);border-radius:9px;background:var(--panel);color:var(--text);width:100%" placeholder="Try goro, nashi, -ho, hu..." value="${esc(state.concordance)}">${!q?'<div class="notice">Enter a Qaroshi root or suffix to find every editorial example containing it.</div>':`<p class="muted small">${hits.length} results shown (maximum 120)</p><div class="card">${hits.map(({p,l,i})=>`<div class="record"><button data-piece="${esc(p.id)}">${esc(p.title)} · line ${i+1}</button><div>${esc(l.qaroshi)}</div><div class="muted small">${esc(l.english_contextual)}</div></div>`).join('')}</div>`}`}
function dictionary(){let q=state.lookup.trim().toLowerCase();let found=q.length>=2?D.lexicon.filter(w=>(w[0]+' '+w[1]).toLowerCase().includes(q)).slice(0,70):[];return h('30,000-word dictionary','Look up canonical definitions and phonemic IPA, then see how forms occur in the texts.')+`<input id="dictInput" style="padding:12px;border:1px solid var(--line);border-radius:9px;background:var(--panel);color:var(--text);width:100%" placeholder="Search Qaroshi or English (minimum two characters)" value="${esc(state.lookup)}"><p class="small muted">${q.length>=2?found.length+' matches shown (maximum 70)':'Enter at least two letters'}</p><div class="card">${found.map(w=>`<div class="record"><span class="wordhead">${esc(w[0])}</span> <span class="tag">${esc(w[2])}</span><div class="ipa">${esc(w[3])}</div><div>${esc(w[1])}</div><button data-conc="${esc(w[0])}">Find examples in corpus</button></div>`).join('')}</div>`}
function review(){return h('Editorial review','Every generated or scripted example requires separate semantic and cultural evaluation before it can become an accepted language example.')+`<div class="notice"><b>Limits:</b> Surface-valid morphology and a plausible English rendering do not establish naturalness, correct information structure, or speaker attestation. The 14.0 semantic validator tests specific documented risks, not every clause interpretation.</div><div class="grid"><div class="card"><div class="metric">${D.stats.newSurfaceValid}</div><div class="caption">New utterances passing v14 structural checks</div></div><div class="card"><div class="metric">${D.stats.newReviewFlags}</div><div class="caption">New v14 machine-generated review flags</div></div><div class="card"><div class="metric">${Object.keys(state.review).length}</div><div class="caption">Your locally saved piece notes</div></div></div><div class="card"><h3>Export your editorial annotations</h3><p>Download your notes as a portable JSON document. The source texts are never rewritten when you annotate them.</p><button class="btn primary" id="exportBtn">Export local notes</button><button class="btn" id="clearBtn">Clear local notes</button></div><div class="card"><h3>Open review-ledger resources</h3><p>Full new corpus: <code>corpus/v15/corpus_rows.csv</code></p><p>Rule output: <code>corpus/v15/editorial_review_queue.csv</code></p><p>Metadata: <code>corpus/v15/manifest.json</code></p><p>Earlier 14.0 translation findings: <code>data/v14/translation_review_103.csv</code></p></div>`}
function about(){return h('How this corpus was made','A verifiable release designed for language learning and editorial improvement, not inflated word counts.')+`<div class="card"><h2>Method</h2><p>The 51 new dialogues and 12 new prose texts were drafted as separate pieces with unique titles and communicative goals. A conservative validation pass checked every new sentence with the 14.0 morphosyntax and translation-risk heuristics. Phonemic IPA and approximate sound-outs were generated from the established phoneme inventory.</p><p>Earlier 49 (11.0) and 54 (12.0) original editorial conversations are included for comparison. The previous repetitive 1,000-dialogue, 123,000-token controlled exercise collection is preserved in the full ZIP but is <b>not</b> included in the independent conversation count.</p><h2>Honest corpus counts</h2><p>New v15 Qaroshi-only whitespace words: <b>${D.stats.newTokens.toLocaleString()}</b>. Newly authored lines: <b>${D.stats.newLines}</b>; unique Qaroshi sentence strings: <b>${D.stats.uniqueNew}</b>. This release does not meet the goal of 1,000 independently authored conversations or a 100,000-word naturalistic corpus.</p><h2>What remains</h2><p>Independent language editing, richer clause variety and cohesive genres, additional contributors, consented speaker evidence, and a much larger non-templated body of writing. Translation nuance must be judged by a reviewer, not by a structural pass.</p><h2>Compatibility</h2><p>The canonical 30,000 dictionary entries, 4,383 reference examples, 90 grammar chapters, 26 original glyph images and 16 mandatory written resonance markers have not been changed.</p></div>`}
function render(){side();$('#globalSearch').value=state.q;let f={library,concordance,dictionary,review,about}[state.section];$('#main').innerHTML=f();bind()}
function bind(){$('#main').querySelectorAll('[data-piece]').forEach(b=>b.onclick=()=>{state.section='library';state.piece=b.dataset.piece;state.allTranslations=false;render();window.scrollTo(0,0)});$('#main').querySelectorAll('[data-word]').forEach(b=>b.onclick=()=>{const k=b.dataset.word.toLowerCase().split('-')[0];state.lookup=k;state.section='dictionary';state.piece=null;render();window.scrollTo(0,0)});$('#main').querySelectorAll('[data-conc]').forEach(b=>b.onclick=()=>{state.concordance=b.dataset.conc;state.section='concordance';render()});if($('#kindFilter'))$('#kindFilter').onchange=e=>{state.kind=e.target.value;state.page=0;render()};if($('#sourceFilter'))$('#sourceFilter').onchange=e=>{state.source=e.target.value;state.page=0;render()};if($('#genreFilter'))$('#genreFilter').onchange=e=>{state.genre=e.target.value;state.page=0;render()};if($('#prev'))$('#prev').onclick=()=>{state.page=Math.max(0,state.page-1);render()};if($('#next'))$('#next').onclick=()=>{state.page++;render()};if($('#back'))$('#back').onclick=()=>{state.piece=null;state.allTranslations=false;render()};if($('#translateBtn'))$('#translateBtn').onclick=()=>{state.allTranslations=!state.allTranslations;document.querySelectorAll('.english-detail').forEach(el=>el.open=state.allTranslations);$('#translateBtn').textContent=(state.allTranslations?'Hide':'Show')+' all translations'};if($('#saveReview'))$('#saveReview').onclick=()=>{state.review[state.piece]={notes:$('#reviewText').value,saved:true};save();render()};if($('#concInput'))$('#concInput').onchange=e=>{state.concordance=e.target.value;render()};if($('#dictInput'))$('#dictInput').onchange=e=>{state.lookup=e.target.value;render()};if($('#exportBtn'))$('#exportBtn').onclick=()=>{const payload={version:'15.0',created:new Date().toISOString(),notes:state.review};const b=new Blob([JSON.stringify(payload,null,2)],{type:'application/json'}),url=URL.createObjectURL(b),a=document.createElement('a');a.href=url;a.download='qaroshi_15_review_notes.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};if($('#clearBtn'))$('#clearBtn').onclick=()=>{if(confirm('Clear locally saved review notes?')){state.review={};save();render()}}}
$('#nav').onclick=e=>{const el=e.target.closest('[data-section]');if(el){state.section=el.dataset.section;state.piece=null;state.page=0;render();window.scrollTo(0,0)}};$('#menubtn').onclick=()=>$('#sidebar').classList.toggle('open');$('#darkbtn').onclick=()=>document.body.classList.toggle('dark');$('#globalSearch').onkeydown=e=>{if(e.key==='Enter'){state.q=e.target.value.trim();state.piece=null;state.section='library';state.page=0;render()}};render();
})();
</script></body></html>
