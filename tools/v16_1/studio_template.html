<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Qaroshi · Root Reform Studio 16.1</title><style>
:root{color-scheme:light;--bg:#f8f6f1;--paper:#fff;--text:#212432;--muted:#747480;--line:#e9e4db;--accent:#6452a0;--accent2:#9f7ce1;--wash:#f1ecfa;--soft:#eeeae4;--success:#277a5e;--warning:#98642d;--danger:#af4c50;--shadow:0 8px 26px #2e243016}
body.dark{color-scheme:dark;--bg:#141319;--paper:#211f29;--text:#eeebf7;--muted:#aaa5b3;--line:#35313f;--accent:#bda8ff;--wash:#322c42;--soft:#2d2a35;--success:#70cca4;--warning:#e6b377;--danger:#e28d93;--shadow:none}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;font-size:14px;line-height:1.55}button,input,select,textarea{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid var(--accent2);outline-offset:2px}header{display:flex;align-items:center;gap:16px;padding:13px 26px;border-bottom:1px solid var(--line);background:var(--paper);position:sticky;top:0;z-index:5}.brand{font:600 22px Georgia,serif;letter-spacing:-.6px;white-space:nowrap}.brand span{color:var(--accent)}.subtitle{color:var(--muted);font-size:12px}.spacer{flex:1}.layout{display:grid;grid-template-columns:220px minmax(0,930px);gap:27px;max-width:1320px;margin:auto;padding:24px 20px}nav{align-self:start;position:sticky;top:83px}nav h4{font-size:11px;color:var(--muted);letter-spacing:1px;text-transform:uppercase;margin:22px 12px 7px}nav button{display:block;width:100%;text-align:left;border:0;background:transparent;color:var(--muted);border-radius:8px;padding:9px 12px;margin:2px 0}nav button:hover,nav button.active{background:var(--wash);color:var(--accent);font-weight:650}main{min-width:0;padding-bottom:80px}h1,h2{font-family:Georgia,serif;font-weight:600;letter-spacing:-.7px}h1{font-size:37px;line-height:1.1;margin:10px 0 10px}h2{font-size:25px;margin:26px 0 12px}h3{font-size:16px;margin:0 0 8px}.lead{font-size:17px;color:var(--muted);max-width:750px;line-height:1.6;margin-bottom:22px}.card{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:19px;margin:12px 0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:11px}.metric{font-size:31px;font-weight:680;letter-spacing:-1px;line-height:1.2}.muted{color:var(--muted)}.small{font-size:12px}.tiny{font-size:11px}.note{padding:12px 16px;border-left:3px solid var(--accent);background:var(--wash);border-radius:6px;margin:16px 0}.notice-warn{border-left-color:var(--warning)}.pill{padding:3px 9px;border-radius:12px;background:var(--wash);color:var(--accent);display:inline-block;font-size:11px;font-weight:680}.pill.gray{background:var(--soft);color:var(--muted)}.button{background:var(--paper);border:1px solid var(--line);border-radius:9px;padding:9px 13px;color:var(--text);display:inline-flex;gap:7px;align-items:center;justify-content:center}.button.primary{background:var(--accent);border-color:var(--accent);color:#fff}body.dark .button.primary{color:#211734}.button:hover{border-color:var(--accent)}.btnrow{display:flex;gap:9px;flex-wrap:wrap;align-items:center;margin:12px 0}.search,.select,textarea{width:100%;border:1px solid var(--line);border-radius:9px;background:var(--paper);color:var(--text);padding:10px 13px}.search{margin:5px 0 13px}textarea{min-height:85px;resize:vertical}.rows{display:grid;gap:10px}.entry{background:var(--paper);border:1px solid var(--line);border-radius:11px;padding:13px 15px}.entry .name{font:600 23px Georgia,serif}.entry .evidence{color:var(--muted);font-size:12px}.entry .foot{margin-top:11px;display:flex;justify-content:space-between;gap:8px;align-items:center;flex-wrap:wrap}.divider{border-bottom:1px solid var(--line);margin:16px 0}.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.segment{font:700 20px Georgia,serif;color:var(--accent);overflow-wrap:anywhere}.arrow{font-size:20px;color:var(--muted)}.proof{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center;padding:12px;background:var(--wash);border-radius:10px;margin:12px 0}.plain{padding:12px;background:var(--bg);border-radius:10px;margin:10px 0}.statbar{background:var(--soft);border-radius:20px;height:9px;overflow:hidden}.statbar>div{background:var(--accent);height:100%}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}.tabs button{border:1px solid var(--line);border-radius:9px;background:var(--paper);color:var(--muted);padding:8px 12px}.tabs button.active{border-color:var(--accent);color:var(--accent);background:var(--wash)}.toolbar{display:flex;gap:10px;align-items:center;margin-bottom:12px;flex-wrap:wrap}.toolbar>*{flex:1;min-width:140px}.conjugate{display:flex;gap:8px;flex-wrap:wrap;margin:13px 0}.conjugate button.active{background:var(--wash);color:var(--accent);border-color:var(--accent)}.result{font:600 26px Georgia,serif}.hint{font-size:11px;color:var(--muted);margin-top:4px}details summary{cursor:pointer;color:var(--accent);font-size:13px;font-weight:600}table{width:100%;border-collapse:collapse;font-size:13px}th,td{border-bottom:1px solid var(--line);padding:9px 6px;text-align:left;vertical-align:top}th{text-transform:uppercase;letter-spacing:.6px;color:var(--muted);font-size:10px}.reviewgrid{display:grid;grid-template-columns:160px 1fr;gap:10px;align-items:center}.reviewgrid label{color:var(--muted);font-size:12px}.footer{color:var(--muted);font-size:12px;text-align:center;padding:30px}.hide{display:none!important}
@media(max-width:850px){.layout{grid-template-columns:175px minmax(0,1fr);gap:14px;padding:16px}nav button{padding:9px 7px}.card{padding:14px}}@media(max-width:640px){header{padding:10px 14px}.brand{font-size:20px}.subtitle{display:none}.layout{display:block;padding:13px}.desktopnav{display:none;position:static;margin-bottom:15px;border:1px solid var(--line);background:var(--paper);padding:9px;border-radius:10px}.desktopnav.open{display:block}h1{font-size:31px}.lead{font-size:15px}.proof{grid-template-columns:1fr auto 1fr}.segment{font-size:17px}.reviewgrid{grid-template-columns:1fr}.entry .name{font-size:21px}}
</style></head><body>
<header><button class="button" id="hamburger" aria-label="Toggle navigation">☰</button><div class="brand">Qaroshi<span> ◆ </span>Root Reform</div><div class="subtitle">16.1 · Lexical transparency and learning</div><div class="spacer"></div><button class="button" id="theme" aria-label="Switch light or dark theme">◐</button></header>
<div class="layout"><nav id="nav" class="desktopnav"><h4>Study</h4><button data-page="home" class="active">Overview</button><button data-page="ladder">Root learning path</button><button data-page="explore">Headword explorer</button><button data-page="grammar">Grammar builder</button><h4>Lexical design</h4><button data-page="proposals">Transparent alternatives</button><button data-page="gaps">Missing building blocks</button><button data-page="queue">Review workspace</button><h4>Sources and controls</h4><button data-page="about">Method and limitations</button></nav><main id="app"></main></div><div class="footer">Qaroshi 16.1 · Offline editorial learning tool · Proposed forms do not replace canonical words</div>
<script>/*DATA*/
const $=s=>document.querySelector(s),html=s=>String(s??'').replace(/[&<>"']/g,k=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[k]));
const D=DATA, glossary=new Map(D.lex.map(x=>[x.q,x]));let tab='home',q='',filter='all',pageSize=35,selected=null,studyIndex=0,studying=false,category='all',formVerb='goro',formAff='ki';
let memory;try{memory=JSON.parse(localStorage.getItem('qr16_1_r1'))||{decisions:{},seen:{},version:1}}catch{memory={decisions:{},seen:{},version:1}}
if(!memory.decisions)memory.decisions={};if(!memory.seen)memory.seen={};const store=()=>localStorage.setItem('qr16_1_r1',JSON.stringify(memory));
const h=(name,description)=>`<h1>${html(name)}</h1><div class="lead">${html(description)}</div>`;
const button=(name,act,style='')=>`<button class="button ${style}" data-action="${act}">${html(name)}</button>`;
const paragraph=(body)=>`<div class="note">${body}</div>`;
const statusText={preexisting_compoundlike_headword:'Existing matching components',primary_gloss_candidate:'Primary-sense split',secondary_sense_candidate:'Secondary-sense split',semantic_anchors_only:'Partial meaning clues',no_documented_derivation:'No supported derivation'};
const note=()=>paragraph('<b>Evidence matters.</b> A split found in English dictionary glosses is a proposed Qaroshi expression, not a proven synonym, historical etymology or accepted spelling. Canonical words are unchanged.');
function nav(p){tab=p;selected=null;q='';filter='all';$('.desktopnav').classList.remove('open');document.querySelectorAll('[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===p));render();window.scrollTo({top:0,behavior:'instant'})}
function m(n){return Number(n).toLocaleString('en-US')}
function home(){let R=D.report,c=R.count_by_status,total=R.headwords_audited;return h('Learn roots, not random strings','Make Qaroshi more predictable without breaking existing vocabulary.')+`<div class="grid"><div class="card"><div class="metric">${m(total)}</div><div class="small muted">Canonical headwords audited</div></div><div class="card"><div class="metric">${m(R.headwords_with_any_exact_split)}</div><div class="small muted">Reviewable modifier–head proposals</div></div><div class="card"><div class="metric">${m(D.compCount)}</div><div class="small muted">Already documented transparent compounds</div></div><div class="card"><div class="metric">${m(D.roots.length)}</div><div class="small muted">Prioritized core study words</div></div></div>`+note()+`<h2>Where the headwords stand</h2><div class="card">${[['Existing form already matches components','preexisting_compoundlike_headword'],['Primary meanings yield a split','primary_gloss_candidate'],['Secondary meanings required','secondary_sense_candidate'],['Partial English meaning clues','semantic_anchors_only'],['No documented derivation','no_documented_derivation']].map(([a,key])=>`<div style="margin-bottom:16px"><div style="display:flex;justify-content:space-between"><b>${a}</b><span>${m(c[key]||0)} · ${((100*(c[key]||0))/total).toFixed(1)}%</span></div><div class="statbar"><div style="width:${100*(c[key]||0)/total}%"></div></div></div>`).join('')}</div>`+
`<h2>Examples</h2><div class="grid"><div class="card"><h3>Predictable construction</h3><div class="segment">banu + qamago</div><p>wing + joint → proposed <b>banuqamago</b></p><div class="small muted">Current canonical word: <b>banuaro</b>. The new spelling is only a candidate.</div>${button('Inspect headwords','go-explore','primary')}</div><div class="card"><h3>Still a basic word</h3><div class="segment">goro</div><p>fly; move through the air</p><div class="small muted">Grammar explains <b>goro-te</b> and <b>goro-ho</b>, but not the basic lexical meaning “fly.”</div>${button('Practice suffixes','go-grammar','primary')}</div><div class="card"><h3>Missing lexical piece</h3><div class="segment">banuwa</div><p>wing membrane</p><div class="small muted">The “wing” component is known; “membrane” does not have an exact mapped noun base in this audit.</div>${button('Inspect gap priorities','go-gaps','primary')}</div></div>`+
`<h2>The design goal</h2><div class="card">Teach frequently used basic words first, show their productive compounds, and offer transparent paraphrases for technical terms where the components genuinely support them. Keep shorter established words as canonical aliases until language editors approve any migration.</div>`}
const indexed=(items,spec)=>items.filter(x=>spec(x).includes(q.toLowerCase()));
function searchbar(placeholder){return `<input class="search" id="search" placeholder="${html(placeholder)}" value="${html(q)}" aria-label="Search">`}
function entryCard(x){let name=x.q, gloss=x.en;return `<div class="entry"><div class="name">${html(name)}</div><div>${html(gloss)}</div><div class="evidence">${html(x.pos)} · ${html(x.ipa)}</div>${button('Dictionary & audit','look-'+html(name))}</div>`}
function explore(){let list=indexed(D.audit,x=>`${x.q} ${x.en} ${x.domain} ${x.alt}`),types=[['all','All headwords'],['primary_gloss_candidate','Primary-sense candidates'],['secondary_sense_candidate','Secondary-sense cautions'],['semantic_anchors_only','Partial clues'],['no_documented_derivation','Atomic / unclear'],['preexisting_compoundlike_headword','Existing transparent spellings']];if(filter!=='all')list=list.filter(x=>x.s===filter);return h('Headword explorer','Search all 16,525 headwords and see what the dictionary can, and cannot, explain.')+searchbar('Try banuaro, wedding, tax, wind, consent...')+`<div class="toolbar"><select id="filter" class="select" aria-label="Filter analysis status">${types.map(([v,t])=>`<option value="${v}" ${filter===v?'selected':''}>${t}</option>`).join('')}</select><span class="muted small">${m(list.length)} matches · first ${Math.min(35,list.length)}</span></div>`+note()+`<div class="rows">${list.slice(0,35).map(x=>`<div class="entry"><div class="entryhead"><div class="name">${html(x.q)} <span class="pill gray">${html(x.pos)}</span></div><div>${html(x.en)}</div><div class="small muted">${html(x.domain)}</div></div><div class="foot"><span class="pill">${html(statusText[x.s])}</span>${button('View details','view-'+html(x.id),'')}</div></div>`).join('')||'<div class="card">No matching entries.</div>'}</div>`}
function detail(){let x=D.audit.find(x=>x.id===selected);if(!x)return explore();const candidate=x.alt,canonical=glossary.get(x.q);return `<div class="btnrow">${button('← Back to headwords','go-explore')}</div>`+h(x.q,x.en)+`<div class="card"><span class="pill">${statusText[x.s]}</span><div class="small muted" style="margin-top:10px">${html(x.domain)} · ${html(x.pos)} · ${html(canonical?.ipa||'')}</div><h2>Documented knowledge</h2><p>${html(x.note)}</p>${x.decomp?`<div class="proof"><b>Documented current spelling:</b> ${html(x.decomp)} → ${html(x.q)}</div>`:''}<div class="grid"><div><b>Controlled examples</b><div class="metric">${m(x.ref)}</div></div><div><b>Separately drafted occurrences</b><div class="metric">${m(x.orig)}</div></div></div></div>`+(candidate?`<div class="card"><h2>Candidate transparent expression</h2><div class="segment">${html(candidate)}</div><div class="proof"><div><b>${html(x.mod)}</b><div class="small">${html(x.modEn)}</div></div><span class="arrow">+</span><div><b>${html(x.head)}</b><div class="small">${html(x.headEn)}</div></div></div><p>Canonical: <b>${html(x.q)}</b> · Proposed form: <b>${html(candidate)}</b></p>${x.primary?'<span class="pill">Both component primary senses align</span>':'<span class="pill gray">At least one secondary meaning is needed</span>'}<p class="small muted">A compositional English match does not prove this is a conventional Qaroshi synonym. Use for study or editorial consideration only.</p>${reviewControls(x)}</div>`:`<div class="card"><h2>Why no proposed spelling?</h2><p>${html(x.anchors||'No independently documented component root was identified for the concept.')}</p><p class="small muted">An English keyword link is not an etymology or a grammar rule. Do not invent lexical endings to force a decomposition.</p>${reviewControls(x)}</div>`)+`<div class="card"><h3>Further inspection</h3><p><b>Canonical dictionary definition:</b> ${html(canonical?.en)}</p><p class="muted small">Entry ${html(x.id)} · All original meanings and spellings remain unchanged.</p></div>`}
function proposalCard(x){return `<div class="entry"><div class="foot"><span class="pill ${x.primary?'':'gray'}">${x.primary?'Primary senses':'Secondary sense caution'}</span><span class="small muted">${html(x.pos)} · ${html(x.domain)}</span></div><div class="name">${html(x.q)}</div><div>${html(x.en)}</div><div class="proof"><div><div class="segment">${html(x.mod)}</div><div class="small muted">${html(x.modEn)}</div></div><div class="arrow">+</div><div><div class="segment">${html(x.head)}</div><div class="small muted">${html(x.headEn)}</div></div></div><p>Proposed spelling: <b>${html(x.alt)}</b></p><div class="foot">${button('Review proposal','view-'+html(x.id),'primary')}<span class="small muted">Not a canonical replacement</span></div></div>`}
function proposals(){let list=indexed(D.audit.filter(x=>!!x.alt),x=>`${x.q} ${x.en} ${x.alt} ${x.mod} ${x.head}`);if(filter==='primary')list=list.filter(x=>x.primary);if(filter==='caution')list=list.filter(x=>!x.primary);return h('Transparent alternatives','Optional forms derived from existing modifier + nominal head meanings. Every proposal requires editorial approval.')+searchbar('Search proposals by Qaroshi or English...')+`<div class="toolbar"><select class="select" id="filter"><option value="all">All candidates</option><option value="primary" ${filter==='primary'?'selected':''}>Primary senses only</option><option value="caution" ${filter==='caution'?'selected':''}>Secondary senses only</option></select><span class="muted small">${m(list.length)} headword proposals · first ${Math.min(30,list.length)}</span></div>`+note()+`<div class="rows">${list.slice(0,30).map(proposalCard).join('')}</div>`}
function gaps(){let list=indexed(D.gaps,x=>`${x.concept} ${x.examples} ${x.role}`);return h('Missing building blocks','Prioritize concepts that recur across many technical headwords. No new Qaroshi roots are coined automatically.')+searchbar('Try membrane, call, cycle, signature...')+`<div class="grid"><div class="card"><div class="metric">${m(D.gaps.length)}</div><div class="small muted">English building-block gaps</div></div><div class="card"><div class="metric">${m(D.gaps.filter(x=>x.count>=3).length)}</div><div class="small muted">Gaps affecting at least 3 headwords</div></div></div>`+note()+`<div class="rows">${list.slice(0,35).map(x=>`<div class="entry"><div class="foot"><div class="name">${html(x.concept)}</div><span class="pill">${x.count} affected headwords</span></div><div class="muted small">${x.role==='missing_noun_head'?'Needed as a nominal head':'Needed as a modifier'}</div><p class="small">${html(x.examples)}</p><p class="small muted">First look for a true synonym already in Qaroshi. If none exists, propose one reusable base root with examples and phonology checks.</p></div>`).join('')}</div>`}
function ladder(){let x=D.roots[studyIndex]||D.roots[0],completed=Object.keys(memory.seen).length;return h('Root learning path','An evidence-ranked starter path through 1,200 reusable or documented headwords. Learn the basic meaning before compound meanings.')+`<div class="grid"><div class="card"><div class="metric">${m(D.roots.length)}</div><div class="small muted">Prioritized study entries</div></div><div class="card"><div class="metric">${m(completed)}</div><div class="small muted">Locally marked learned</div></div></div><div class="card"><div class="toolbar"><input type="range" min="0" max="${D.roots.length-1}" value="${studyIndex}" id="studySlider" style="width:100%"><span class="muted small">${studyIndex+1} / ${D.roots.length}</span></div><div class="pill">${html(x.pos)} · ${html(x.ipa)}</div><h2 style="font-size:35px">${html(x.q)}</h2><div class="small muted">Try recalling the meaning before revealing it</div><div style="margin:12px 0">${button(studying?'Hide meaning':'Reveal meaning','flip-study','primary')}</div>${studying?`<div class="plain"><h3>${html(x.en)}</h3><p class="small muted">Controlled examples: ${x.ref}; Editorial occurrences: ${x.orig}; Reused in compounds: ${x.reuse}</p></div><div class="btnrow">${button('Mark learned','learn-study','primary')}</div>`:''}<div class="btnrow">${button('← Previous root','prev-study')}${button('Next root →','next-study')}</div></div>`+paragraph('A learning rank is a scheduling aid, not a claim that words can be guessed from sound. Root spellings themselves still need to be learned.');}
function grammar(){let e=glossary.get(formVerb),pron={'goro':'fly','mara':'friend'};let aff=formAff==='te'?{ending:'-te',meaning:'past'}:formAff==='yu'?{ending:'-yu',meaning:'future'}:formAff==='ki'?{ending:'-ki',meaning:'able to'}:formAff==='ho'?{ending:'-ho',meaning:'permitted to'}:formAff==='du'?{ending:'-du',meaning:'required to'}:formAff==='se'?{ending:'-te-se',meaning:'past progressive'}:{ending:'',meaning:'present'};return h('Grammar is not vocabulary','Suffixes help you understand new forms of known words. They do not explain arbitrary lexical roots.')+`<div class="card"><h3>Known root</h3><select id="verb" class="select"><option value="goro" ${formVerb==='goro'?'selected':''}>goro · fly</option><option value="shiri" ${formVerb==='shiri'?'selected':''}>shiri · speak</option><option value="nëru" ${formVerb==='nëru'?'selected':''}>nëru · rest</option></select><h3 style="margin-top:17px">Grammar slot</h3><div class="conjugate">${[['te','Past'],['yu','Future'],['ki','Ability'],['ho','Permission'],['du','Obligation'],['se','Was doing']].map(([k,label])=>`<button class="button ${formAff===k?'active':''}" data-aff="${k}">${label}</button>`).join('')}</div><div class="plain"><span class="result">${html(formVerb+aff.ending)}</span><div class="muted small">${html((glossary.get(formVerb)?.en||formVerb)+' · '+aff.meaning)}</div></div><div class="divider"></div><h3>Nominal suffix order</h3><table><tr><th>Form</th><th>Interpretation</th></tr><tr><td><b>mara</b></td><td>friend</td></tr><tr><td><b>mara-ri</b></td><td>friends</td></tr><tr><td><b>mara-ri-m</b></td><td>friends as direct object</td></tr><tr><td><b>mara-m-ri</b></td><td>Invalid order: plural precedes case</td></tr></table></div>`+paragraph('Verb slots: root + voice + tense + aspect + modality + manner. Noun slots: root + derivation + endearment + plural + case + topic. The same spelling is not proof of shared etymology.');}
function reviewControls(x){let d=memory.decisions[x.id]||{decision:'',note:''};return `<div class="reviewgrid"><label for="revDecision">Editorial decision</label><select id="revDecision" class="select"><option value="">Not reviewed</option>${[['review','Further review'],['keep','Keep canonical as-is'],['candidate','Candidate for review'],['reject','Reject proposed alternative']].map(([v,n])=>`<option value="${v}" ${d.decision===v?'selected':''}>${n}</option>`).join('')}</select><label for="revNote">Review rationale</label><textarea id="revNote" placeholder="Cite a grammar rule, known source, or semantic concern...">${html(d.note||'')}</textarea></div><div class="btnrow">${button('Save review locally','save-review','primary')}</div>`}
function queue(){let entries=Object.entries(memory.decisions);return h('Local editorial review workspace','Decisions are stored in this browser, not submitted, not applied to the dictionary, and never automatically approved.')+`<div class="grid"><div class="card"><div class="metric">${m(entries.length)}</div><div class="small muted">Saved review records</div></div><div class="card"><div class="metric">${m(Object.keys(memory.seen).length)}</div><div class="small muted">Learned words</div></div></div><div class="card"><h3>Portable backups</h3><p class="small muted">Export your decisions to JSON. Import one later to continue review on another browser. No online account or tracking.</p><div class="btnrow">${button('Export progress JSON','export-data','primary')}<label class="button" for="importFile">Import JSON</label><input id="importFile" type="file" accept="application/json" style="width:190px">${button('Clear saved reviews','clear-review')}</div></div><div class="rows">${entries.slice(0,50).map(([id,v])=>{let x=D.audit.find(x=>x.id===id);return `<div class="entry"><b>${html(x?.q||id)}</b> · <span class="pill">${html(v.decision)}</span><p class="small muted">${html(v.note||'No rationale recorded.')}</p>${button('View','view-'+html(id))}</div>`}).join('')||'<div class="card">No editorial decisions have been saved.</div>'}</div>`}
function about(){return h('Method and limitations','Exactly what was derived, how it was derived, and what remains a proposal.')+`<div class="card"><h2>Three meanings of “derivable”</h2><p><b>1. Grammar:</b> productive inflection on a known root, e.g. <code>goro-ki</code>. Grammar does not define <code>goro</code>.</p><p><b>2. Canonical compounding:</b> the documented 13,379 modifier-head compounds resolve to 1,820 ultimate base words. Their literal structure is readable, but exact technical meanings can still be specialized.</p><p><b>3. New proposals:</b> an English gloss can be broken into concepts with existing Qaroshi words, leading to candidate expressions for some opaque headwords. These are not adopted spellings, accepted synonyms or invented historical roots.</p></div><div class="card"><h2>Source integrity</h2><p>30,000 entries have unchanged identifiers, meanings and spellings. This app contains their source definitions for reference. No new headword is automatically added to the canonical lexicon.</p><p class="small muted">The audit does not invent derivational affixes, assume that letter sequences have semantic meaning, treat English gloss synonyms as identical, or infer attested spoken dialects.</p><p><b>Approval process:</b> compare meanings in context → check collision and phonotactics → collect example texts and independent translations → decide whether to retain canonical form, accept an optional paraphrase, or reject it → only then consider a standards change with backwards-compatibility notes.</p></div><div class="card"><h2>Reproducibility</h2><p>Python scripts: <code>tools/v16_1/headword_audit.py</code>, <code>root_gap_audit.py</code>, <code>build_studio.py</code>. CSVs: audit of 16,525 headwords, strict candidates, lexical gaps and 1,200 prioritized study roots. Full method and source hashes are in the release ZIP.</p></div>`}
function render(){const pages={home,ladder,explore,grammar,proposals,gaps,queue,about};$('#app').innerHTML=(selected?detail():pages[tab]());bind()}
function bind(){let search=$('#search');if(search){search.oninput=e=>{q=e.target.value;let start=search.selectionStart;render();let n=$('#search');n.focus();n.setSelectionRange(start,start)}}let f=$('#filter');if(f)f.onchange=e=>{filter=e.target.value;render()};let range=$('#studySlider');if(range)range.oninput=e=>{studyIndex=+e.target.value;studying=false;render()};let verb=$('#verb');if(verb)verb.onchange=e=>{formVerb=e.target.value;render()};document.querySelectorAll('[data-aff]').forEach(b=>b.onclick=()=>{formAff=b.dataset.aff;render()});let imp=$('#importFile');if(imp)imp.onchange=async e=>{try{let x=JSON.parse(await e.target.files[0].text());if(x.format!=='Qaroshi16ReviewV1'||typeof x.decisions!=='object'||!x.decisions||!x.seen)throw Error('Not a Qaroshi 16.1 review backup');memory={decisions:x.decisions,seen:x.seen,version:1};store();render();alert('Review backup imported.')}catch(err){alert(err.message)}};document.querySelectorAll('[data-action]').forEach(b=>b.onclick=()=>act(b.dataset.action))}
function download(name,txt,type='application/json'){let url=URL.createObjectURL(new Blob([txt],{type})),a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function act(command){if(command.startsWith('view-')){selected=command.substring(5);render();scrollTo(0,0);return}if(command.startsWith('look-')){let a=D.audit.find(x=>x.q===command.substring(5));if(a){selected=a.id;render();scrollTo(0,0);return}q=command.substring(5);tab='explore';render();return}if(command.startsWith('go-')){nav(command.substring(3));return}if(command==='flip-study'){studying=!studying;render()}if(command==='next-study'){studyIndex=(studyIndex+1)%D.roots.length;studying=false;render()}if(command==='prev-study'){studyIndex=(studyIndex-1+D.roots.length)%D.roots.length;studying=false;render()}if(command==='learn-study'){memory.seen[D.roots[studyIndex].q]=true;store();studyIndex=(studyIndex+1)%D.roots.length;studying=false;render()}if(command==='save-review'){if(!selected)return;let decision=$('#revDecision').value,note=$('#revNote').value.trim();if(decision||note){memory.decisions[selected]={decision,note,updated:new Date().toISOString()}}else delete memory.decisions[selected];store();render();alert('Saved locally. The canonical dictionary is unchanged.')}if(command==='export-data'){download('qaroshi_16_1_review_backup.json',JSON.stringify({format:'Qaroshi16ReviewV1',exported_at:new Date().toISOString(),decisions:memory.decisions,seen:memory.seen},null,2))}if(command==='clear-review'){if(confirm('Clear your local review decisions and learned-word progress?')){memory={decisions:{},seen:{},version:1};store();render()}}}
$('#nav').addEventListener('click',e=>{let b=e.target.closest('[data-page]');if(b)nav(b.dataset.page)});$('#theme').onclick=()=>document.body.classList.toggle('dark');$('#hamburger').onclick=()=>$('#nav').classList.toggle('open');render();
</script></body></html>
